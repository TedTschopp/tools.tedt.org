<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#183e35" />
    <meta
      name="description"
      content="Explore Southern California Edison’s complete service territory on a one-mile strategy map with terrain, energy, climate and community data."
    />
    <title>Edison Atlas · Southern California Edison service territory</title>
    <meta property="og:title" content="Edison Atlas" />
    <meta
      property="og:description"
      content="Explore Southern California Edison’s territory one mile at a time, from neighborhood health and electricity use to cooling centers and one-mile grid planning."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tools.tedt.org/edison-atlas/" />
    <meta
      property="og:image"
      content="https://tools.tedt.org/img/2026-11/edison-atlas-coast.webp"
    />
    <meta
      property="og:image:alt"
      content="The Ventura and Oxnard coastline on the illustrated one-mile Edison Atlas."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="identity">
        <img src="assets/mark.svg" width="38" height="40" alt="" />
        <h1>Edison Atlas</h1>
        <span class="org">Southern California Edison</span>
      </div>
      <nav class="primary" aria-label="Atlas navigation">
        <button id="nav-map" aria-current="page">
          <span data-icon="map"></span>Map
        </button>
        <button id="nav-almanac"><span data-icon="book"></span>Almanac</button>
        <button id="nav-sources">
          <span data-icon="database"></span>Sources
        </button>
      </nav>
      <button id="share" class="share">
        <span data-icon="share"></span><span>Share view</span>
      </button>
    </header>
    <main class="workspace">
      <aside
        class="sidebar"
        id="sidebar"
        aria-label="Map layers and geography profiles"
      >
        <div id="side-body"></div>
        <div class="side-foot">
          <button id="method">
            <span data-icon="info"></span>Grid &amp; methodology</button
          ><button id="mobile-close" aria-label="Close map panel">
            <span data-icon="close"></span>
          </button>
        </div>
      </aside>
      <section
        class="map-shell"
        id="map-shell"
        aria-label="Interactive territory map"
      >
        <canvas id="base" aria-hidden="true"></canvas>
        <canvas
          id="map"
          tabindex="0"
          aria-label="One-mile hex map. Drag or use arrow keys to pan. Use plus and minus to zoom. Press Enter to inspect the center tile. The search and Almanac provide text access to the data."
        ></canvas>
        <div class="find-wrap" role="search">
          <div class="find">
            <span data-icon="search"></span
            ><input
              id="find"
              role="combobox"
              aria-label="Find a city, metro, county, state, hex or landmark"
              aria-expanded="false"
              aria-autocomplete="list"
              aria-controls="results"
              placeholder="Find a place, metro, county or hex"
              autocomplete="off"
            /><kbd>/</kbd>
          </div>
          <div id="results" class="results" role="listbox" hidden></div>
        </div>
        <button
          id="mobile-layers"
          aria-label="Open map layers"
          aria-controls="sidebar"
        >
          <span data-icon="layers"></span>Layers
        </button>
        <div class="utility-control" id="utility-control">
          <div class="utility-bar">
            <button
              id="utility-toggle"
              data-overlay="utility"
              role="switch"
              aria-checked="true"
            >
              <span data-icon="bolt" aria-hidden="true"></span>Utility layer
            </button>
            <button
              id="utility-menu"
              aria-controls="utility-panel"
              aria-expanded="false"
              aria-label="Utility layer filters"
              title="Utility layer filters"
            >
              <span data-icon="down" aria-hidden="true"></span>
            </button>
          </div>
          <section id="utility-panel" aria-label="Utility layer filters" hidden>
            <h3>Utility resources</h3>
            <p>Reported sites inside the SCE boundary, across all owners.</p>
            <div id="utility-kinds"></div>
            <label for="utility-area">Explore a 12-mile area</label>
            <select id="utility-area"></select>
            <p id="utility-scale"></p>
          </section>
        </div>
        <div class="north" title="Grid north" aria-hidden="true">
          <b>N</b
          ><svg viewBox="0 0 40 46">
            <path d="m20 2 7 28-7-6-7 6Z" fill="#355346" />
            <path d="m20 2 0 22-7 6Z" fill="#ece3be" />
            <path d="m20 44-4-16 4 3 4-3Z" fill="#728578" />
            <path d="M1 23h10m18 0h10" stroke="#758377" />
          </svg>
        </div>
        <div class="map-tools" aria-label="Map controls">
          <button id="zoom-in" title="Zoom in (+)" aria-label="Zoom in">
            <span data-icon="plus"></span>
          </button>
          <button id="zoom-out" title="Zoom out (−)" aria-label="Zoom out">
            <span data-icon="minus"></span>
          </button>
          <button
            id="fit"
            title="Fit full territory (Home)"
            aria-label="Fit full territory"
          >
            <span data-icon="fit"></span>
          </button>
        </div>
        <div id="legend" class="legend"></div>
        <button
          class="locator"
          id="locator"
          title="Navigate with the overview map"
          aria-label="Overview map. Click to reposition or press Enter to fit the territory."
        >
          <canvas id="mini" width="144" height="92"></canvas>
        </button>
        <div id="scale" class="scale" aria-label="Map distance scale">
          <span></span><i></i>
        </div>
        <div id="hover" class="hover" hidden></div>
        <div id="loading" role="status">Drawing the territory…</div>
      </section>
    </main>
    <footer class="status">
      <div>
        <!-- tools-catalog-return -->
        <span class="status-dot"></span
        ><span id="status-mode">Service territory</span
        ><span class="status-divider">/</span
        ><span id="status-info">Loading geographic data</span>
      </div>
      <span class="status-right"
        ><span data-icon="hex"></span
        ><span id="geography-status">1 mile across flats</span></span
      >
    </footer>
    <dialog id="dialog">
      <div class="dialog-head">
        <div>
          <span class="eyebrow">EDISON ATLAS</span>
          <h2 id="dialog-title"></h2>
        </div>
        <button class="icon-btn" id="dialog-close" aria-label="Close dialog">
          <span data-icon="close"></span>
        </button>
      </div>
      <div id="dialog-body"></div>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <noscript>Enable JavaScript to draw and inspect the map.</noscript>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
